<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Detail Pendaftaran</h1>
        <table>
            <tr>
                <th>Data</th>
                <th>Informasi</th>
            </tr>
            <tr>
                <td>Nama Lengkap</td>
                <td id="nama">-</td>
            </tr>
            <tr>
                <td>NIM</td>
                <td id="nim">-</td>
            </tr>
            <tr>
                <td>Email</td>
                <td id="email">-</td>
            </tr>
            <tr>
                <td>Program Studi</td>
                <td id="prodi">-</td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td id="jenis_kelamin">-</td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td id="alamat">-</td>
            </tr>
        </table>

        <a class="back-link" href="index.html">Kembali ke Formulir</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const fields = ["nama", "nim", "email", "prodi", "jenis_kelamin", "alamat"];
        fields.forEach(function(field) {
            const value = params.get(field);
            if (value) {
                document.getElementById(field).textContent = value;
            }
        });
    </script>
</body>
</html>
